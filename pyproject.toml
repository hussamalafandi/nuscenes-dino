[project]
name = "nuscenes-dino"
version = "0.1.0"
description = "Pipeline for routing nuScenes sensor data into a vision-language model."
authors = [ { name = "AutoGenerated" } ]
requires-python = ">=3.10"
dependencies = [
  "nuscenes-devkit>=1.1.10",
  "Pillow>=9.0.0",
  "torch>=2.1.0",
  "transformers>=4.56.0",
  "tqdm>=4.66.0"
]

[project.urls]
Repository = "https://example.com/nuscenes-dino"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nuscenes_dino*"]
